name: samma_ai
description: Samma AI - Tipitaka Chatbot for Buddhist teachings
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.4.10

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

  # Markdown rendering (for response display)
  flutter_markdown: ^0.6.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
