name: Production Monitoring

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Check service health
        env:
          SERVER: ${{ secrets.PRODUCTION_SERVER }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh ${USER}@${SERVER} << 'EOF'
            # Check container status
            echo "=== Container Status ==="
            docker ps --filter "name=gvpocr" --format "table {{.Names}}\t{{.Status}}"

            # Check health endpoints
            echo -e "\n=== Health Endpoints ==="
            curl -f http://localhost:5000/health || echo "Backend health check failed"
            curl -f http://localhost:5001/health || echo "Review API health check failed"
            curl -f http://localhost:5002/health || echo "Cost API health check failed"

            # Check disk space
            echo -e "\n=== Disk Space ==="
            df -h / | tail -1

            # Check recent errors
            echo -e "\n=== Recent Errors (last hour) ==="
            docker logs gvpocr-backend-prod --since 1h 2>&1 | grep -i error | tail -5 || echo "No recent errors"
          EOF

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: 'failure'
          text: 'Production health check failed!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  metrics-report:
    name: Generate Metrics Report
    runs-on: ubuntu-latest
    needs: health-check
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Collect metrics
        env:
          SERVER: ${{ secrets.PRODUCTION_SERVER }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh ${USER}@${SERVER} << 'EOF'
            # Get completeness metrics
            echo "=== Completeness Metrics ==="
            curl -s http://localhost:5002/api/metrics/completeness | jq .

            # Get cost metrics
            echo -e "\n=== Cost Metrics ==="
            curl -s http://localhost:5002/api/costs/summary | jq .

            # Get queue depth
            echo -e "\n=== Queue Depth ==="
            curl -s http://localhost:4151/stats | jq .topics

            # Get processing stats
            echo -e "\n=== Processing Stats ==="
            docker logs gvpocr-enrichment-worker-prod --since 24h 2>&1 | \
              grep "processing_time" | tail -10 || echo "No processing stats"
          EOF

      - name: Send report
        uses: 8398a7/action-slack@v3
        with:
          status: 'success'
          text: 'Daily metrics report generated'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  backup-verification:
    name: Verify Backups
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Check backups
        env:
          SERVER: ${{ secrets.PRODUCTION_SERVER }}
          USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh ${USER}@${SERVER} << 'EOF'
            cd ${DEPLOY_PATH}

            # Check for recent backup
            LATEST_BACKUP=$(ls -t backups/mongodb_backup_*.gz 2>/dev/null | head -1)

            if [ -z "$LATEST_BACKUP" ]; then
              echo "ERROR: No backups found!"
              exit 1
            fi

            # Check backup age
            BACKUP_AGE=$(find "$LATEST_BACKUP" -mtime +2 2>/dev/null)
            if [ -n "$BACKUP_AGE" ]; then
              echo "WARNING: Latest backup is older than 2 days"
              exit 1
            fi

            # Check backup size
            BACKUP_SIZE=$(du -h "$LATEST_BACKUP" | cut -f1)
            echo "Latest backup: $LATEST_BACKUP ($BACKUP_SIZE)"

            # Verify backup is not empty
            if [ ! -s "$LATEST_BACKUP" ]; then
              echo "ERROR: Backup file is empty!"
              exit 1
            fi

            echo "Backup verification passed"
          EOF

      - name: Notify on backup issue
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: 'failure'
          text: 'Production backup verification failed!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Run security checks
        env:
          SERVER: ${{ secrets.PRODUCTION_SERVER }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh ${USER}@${SERVER} << 'EOF'
            # Check for security updates
            echo "=== Security Updates ==="
            sudo apt update
            SECURITY_UPDATES=$(apt list --upgradable 2>/dev/null | grep -i security | wc -l)
            echo "Security updates available: $SECURITY_UPDATES"

            # Check firewall status
            echo -e "\n=== Firewall Status ==="
            sudo ufw status | grep Status

            # Check for exposed ports
            echo -e "\n=== Listening Ports ==="
            sudo netstat -tlnp | grep LISTEN

            # Check failed login attempts
            echo -e "\n=== Failed Login Attempts (last 24h) ==="
            sudo grep "Failed password" /var/log/auth.log | grep "$(date +%b\ %e)" | wc -l || echo "0"
          EOF

      - name: Notify on security issues
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: 'warning'
          text: 'Security scan found issues requiring attention'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  cost-alert:
    name: Cost Alert Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Check costs
        env:
          SERVER: ${{ secrets.PRODUCTION_SERVER }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh ${USER}@${SERVER} << 'EOF'
            # Get daily costs
            DAILY_COST=$(curl -s http://localhost:5002/api/costs/daily | jq -r '.total_cost')

            # Get monthly costs
            MONTHLY_COST=$(curl -s http://localhost:5002/api/costs/monthly | jq -r '.total_cost')

            # Get budget from env
            DAILY_BUDGET=$(grep DAILY_BUDGET_USD .env.production | cut -d= -f2)
            MONTHLY_BUDGET=$(grep MONTHLY_BUDGET_USD .env.production | cut -d= -f2)

            echo "Daily cost: \$$DAILY_COST / \$$DAILY_BUDGET"
            echo "Monthly cost: \$$MONTHLY_COST / \$$MONTHLY_BUDGET"

            # Alert if over budget
            if (( $(echo "$DAILY_COST > $DAILY_BUDGET" | bc -l) )); then
              echo "ERROR: Daily cost exceeds budget!"
              exit 1
            fi

            if (( $(echo "$MONTHLY_COST > $MONTHLY_BUDGET" | bc -l) )); then
              echo "WARNING: Monthly cost exceeds budget!"
              exit 1
            fi
          EOF

      - name: Send cost alert
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: 'warning'
          text: 'Cost budget exceeded!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
